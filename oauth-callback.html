<!DOCTYPE html>
<html>
<head>
    <title>Connection Successful</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .checkmark {
            color: #4CAF50;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="checkmark">✓</div>
    <h2>Connection Established!</h2>
    <p>You can safely close this window.</p>
    <script>
        // Automatically close after 3 seconds
        setTimeout(() => {
            window.close();
        }, 3000);
    </script>
</body>
</html>
